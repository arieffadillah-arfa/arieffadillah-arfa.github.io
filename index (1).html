<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio Widyaiswara</title>
<style>
:root{--bg:#f6f8f9;--ink:#17242b;--mute:#5b6b73;--line:#d5dde1;--acc:#1f5f7a;--acc-bg:#e3eef3;--chip:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a1f;--ink:#e6eef1;--mute:#93a4ac;--line:#263740;--acc:#6db7d3;--acc-bg:#16303b;--chip:#142229}}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1,h2{font-family:Charter,"Iowan Old Style",Georgia,serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.6rem)}
.jab{color:var(--acc);font-weight:600;margin:.4rem 0 0}
.ringkas{color:var(--mute);max-width:62ch;margin:.8rem 0 0}
.tautan{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0 0;padding:0;list-style:none}
a{color:var(--acc)}
.ringkasan{display:flex;gap:2rem;flex-wrap:wrap;margin:2rem 0 1.5rem;padding:1rem 0;border-block:1px solid var(--line)}
.ringkasan div{min-width:6rem}
.ringkasan b{display:block;font:600 1.6rem/1.2 Charter,Georgia,serif}
.ringkasan span{color:var(--mute);font-size:.88rem}
.filter{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.filter input,.filter select{font:inherit;padding:.5rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink);min-width:0}
.filter input{flex:1 1 12rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tahun{margin-top:2.2rem;display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:.3rem}
.tahun h2{font-size:1.5rem}
.tahun small{color:var(--mute)}
.item{display:grid;grid-template-columns:9.5rem 1fr;gap:0 1.25rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.tgl{color:var(--mute);font-size:.9rem;padding-top:.15rem}
.item h3{margin:0;font-size:1.05rem;line-height:1.4}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.tag{font-size:.8rem;padding:.05rem .55rem;border-radius:99px;background:var(--acc-bg);color:var(--acc)}
.tag.jp{background:none;border:1px solid var(--line);color:var(--mute)}
.item p{margin:.3rem 0 0;color:var(--mute);max-width:65ch}
.bukti{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.5rem;font-size:.9rem}
.kosong{padding:2rem 0;color:var(--mute)}
footer{margin-top:3rem;color:var(--mute);font-size:.85rem}
@media(max-width:560px){.item{grid-template-columns:1fr}.tgl{margin-bottom:.2rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="nama"></h1>
  <p class="jab" id="jabatan"></p>
  <p class="ringkas" id="ringkas"></p>
  <ul class="tautan" id="tautan"></ul>
</header>

<section class="ringkasan" id="ringkasan" aria-label="Ringkasan"></section>

<div class="filter">
  <input type="search" id="cari" placeholder="Cari kegiatan…" aria-label="Cari kegiatan">
  <select id="fTahun" aria-label="Tahun"></select>
  <select id="fUnsur" aria-label="Unsur kegiatan"></select>
</div>

<main id="daftar"></main>

<footer>Diperbarui: <span id="update"></span>. Dokumen asli tersimpan terpisah dan dapat ditunjukkan saat diperlukan.</footer>
</div>

<script>
/* =====================================================================
   BAGIAN YANG ANDA EDIT  (tidak perlu mengubah kode di bawah garis akhir)
   Tips: tanda kutip " harus tetap ada, dan setiap kegiatan diakhiri koma.
   JANGAN tulis NIP, nomor HP, atau data pribadi peserta di sini.
   ===================================================================== */

const PROFIL = {
  nama: "Arief Fadillah, S.Si., M.M.",
  jabatan: "Widyaiswara Ahli Pertama",
  instansi: "PPSDM Ketenagakerjaan",
  ringkas: "Saya merupakan Widyaiswara Ahli Pertama yang berfokus pada bidang Pengantar Kerja, khususnya dalam pengembangan kompetensi dan pembelajaran bagi aparatur di bidang ketenagakerjaan. Memiliki keahlian dalam penyusunan materi pembelajaran, pengembangan media pembelajaran inovatif, serta fasilitasi pelatihan yang mendukung peningkatan kompetensi profesional Pengantar Kerja. Selain itu, saya memiliki minat dan kemampuan dalam pemanfaatan teknologi digital untuk menciptakan pembelajaran yang interaktif, aplikatif, dan relevan dengan kebutuhan dunia kerja.",
  tautan: [
    // { label: "Folder bukti (Google Drive)", url: "https://drive.google.com/..." },
  ],
  diperbarui: "September 2026"
};

/* Daftar unsur kegiatan. Sesuaikan namanya dengan format portofolio resmi LAN. */
const UNSUR = [
  "Pendidikan dan Pelatihan",
  "Pelaksanaan Pembelajaran",
  "Perencanaan dan Evaluasi Diklat",
  "Bahan Ajar dan Inovasi",
  "Karya Tulis dan Publikasi",
  "Kegiatan Penunjang"

/* Singkatan agar baris pendek: P, M, N = nama unsur di atas. */
const P = "Pendidikan dan Pelatihan", M = "Pelaksanaan Pembelajaran", N = "Kegiatan Penunjang";

/* Cara menambah kegiatan: salin satu baris K(...) lalu ganti isinya.
   K( tanggal, unsur, judul, peran, jp, tanggalSelesai )
   - tanggal : "TAHUN-BULAN-TANGGAL", contoh "2026-10-15". Kosongkan ("") jika belum tahu.
   - peran   : "Peserta", "Pengajar", dst. Kosongkan ("") jika belum diisi.
   - jp      : angka jam pelajaran, 0 jika tidak ada.
   - tanggalSelesai : isi hanya jika kegiatan berlangsung beberapa hari.
   Setiap baris diakhiri koma. Judul memakai tanda kutip lurus di awal dan akhir saja. */
const K = (tanggal, unsur, judul, peran, jp, sampai) => ({ tanggal, sampai, unsur, judul, peran, jp, deskripsi: "", bukti: [] });

const KEGIATAN = [
  K("2025-05-15", P, "Workshop Penulisan Karya Tulis Ilmiah (KTI) Asosiasi Profesi Widyaiswara Indonesia", "Peserta", 5),
  K("2025-11-26", P, "Workshop Pembuatan Pelatihan Bagi SDM Aparatur pada LMS Pelatihan Platform KCLC", "Peserta", 8),
  K("2025-11-25", P, "Workshop Pembuatan Pelatihan Jabatan Fungsional Ketenagakerjaan pada LMS Pelatihan Platform KCLC", "Peserta", 8),
  K("2025-10-29", P, "Workshop Pembuatan Konten Pelatihan pada Platform KCLC", "Peserta", 0),
  K("2025-06-10", P, "Workshop Bahan Paparan Kreatif dan Editing Video menggunakan Canva dan Capcut Tahun 2025", "Peserta", 28, "2025-06-13"),
  K("2025-10-24", N, "Webinar Ketenagakerjaan 2025: “Membaca Dinamika Pekerja Informal: Antara Pilihan, Keterpaksaan dan Tantangan Kebijakan”", "", 3),
  K("2025-08-21", N, "Webinar ASN Belajar Seri 32: “Akuntabilitas Kinerja ASN: Jalan Pengabdian Menuju Birokrasi Bersih dan Berintegritas”", "Peserta", 3),
  K("2025-06-26", N, "Webinar ASN Belajar Seri 24: “Hijrah ASN: Mengokohkan Identitas, Mengembangkan Profesionalitas, Menguatkan Identitas”", "Peserta", 3),
  K("2026-02-02", P, "Training of Trainer (ToT) Pengampu Materi Peningkatan Kompetensi Teknis Jabatan Fungsional Pengawas Ketenagakerjaan dan Penguji K3", "", 0, "2026-02-05"),
  K("2025-09-26", P, "Sit In OJT di SMKN 22", "", 0),
  K("2025-09-12", P, "Sit In OJT di PT. Nittera Mobility Indonesia", "", 0),
  K("2025-09-22", P, "Sit In OJT di Pusat Pasar Kerja Kemnaker", "", 0),
  K("2025-09-24", P, "Sit In OJT di Job Portal Swasta PT. Redy", "", 0),
  K("2025-09-18", P, "Sit In OJT di BP3MI Provinsi Jakarta", "", 0),
  K("2025-10-16", N, "Sharing Session “Toxic Workplace: Apa Benar Semua Bermula dari Kantor?”", "", 3),
  K("2025-09-18", N, "Sharing Knowledge Sistem Monitoring Peminjaman Ruangan dan Checklist Pemeriksaan Kendaraan Dinas", "", 1),
  K("2025-09-16", N, "Sharing Knowledge Video Tutorial Pengunggahan Konten Pembelajaran pada Kemnaker Corpu Learning Center (KCLC)", "", 1),
  K("2025-09-15", N, "Sharing Knowledge Pencegahan dan Penanggulangan Kebakaran di Lingkungan Pusat Pengembangan Sumber Daya Manusia Ketenagakerjaan", "", 1),
  K("2025-09-17", N, "Sharing Knowledge Hasil Analisis Kebutuhan Pelatihan 2025 Berdasarkan Sampel dari 9 Daerah di 7 Provinsi Tahun 2025", "", 1),
  K("2025-10-08", N, "Virtual Public Lecture Penjaminan Mutu Series 2: “Transformasi Lembaga Pelatihan untuk Mendukung Sistem Pembelajaran Terintegrasi”", "", 3),
  K("2025-10-15", N, "Virtual Public Lecture Penjaminan Mutu Series 3: “Inovasi Pelayanan dalam Lembaga Pelatihan: Mendorong Efisiensi, Responsivitas, dan Kepuasan Peserta”", "", 3),
  K("2025-07-02", N, "Program Community of Practice (COP) Widyaiswara: Mengenal Jabatan Fungsional Mediator Hubungan Industrial dan Sarana-Sarana Hubungan Industrial", "", 2),
  K("2025-11-25", N, "Pencegahan dan Penanggulangan Kebakaran di Perkantoran Melalui Platform Kemnaker Corpu Learning Center (KCLC)", "", 3),
  K("2025-10-13", P, "Kelas Menguasai Seni Berkomunikasi", "Peserta", 3),
  K("2025-11-20", P, "Pelatihan Kompetensi Pengadaan Barang/Jasa Pemerintah (PBJP) Level-1 Model MOOC Batch 3 Tahun 2025", "Peserta", 36, "2025-12-10"),
  K("2025-10-27", P, "AI for Government of Indonesia Training", "Peserta", 4),
  K("2025-06-20", N, "Sharing Knowledge Ketenagakerjaan Series 1 Tahun 2025: “TBC di Tempat Kerja: Ancaman Biological Hazard yang Mengintai”", "", 0),
  K("2025-05-14", P, "Pembekalan CPNS dan PPPK Pusat Pengembangan SDM Ketenagakerjaan Tahun 2025", "Peserta", 24, "2025-05-16"),
  K("2025-05-26", N, "Sharing Knowledge Persiapan Pelatihan Dasar CPNS", "", 1),
  K("2026-05-20", N, "Webinar Sharing Session Kemnaker Corpu Learning Series 4: “Lesson Learned Pelatihan Japanese Language Education”", "", 1),
  K("", M, "Pengajar dan Penyusun pelatihan Implementasi Core Values BerAKHLAK: Berorientasi Pelayanan", "Pengajar dan Penyusun", 3),
  K("", M, "Pengajar dan Penyusun pelatihan Implementasi Core Value ASN BerAKHLAK: Akuntabel", "Pengajar dan Penyusun", 5),
  K("", P, "Pelatihan Penyamaan Persepsi Agenda I Latsar CPNS Bagi Calon Fasilitator Latsar CPNS", "Peserta", 29),
  K("2026-06-10", N, "Webinar Kemnaker Corpu Learning Series 5: “ASN Cerdas Keuangan: Dompet Sehat, Kinerja Melesat”", "Peserta", 2),
  K("2026-06-19", N, "Sharing Session Kemnaker Corpu Learning Series 5: “Grow Beyond Limits: Mengembangkan Talenta ASN Melalui AI, Digitalisasi dan Green Jobs”", "Peserta", 2),
  K("", P, "Pelatihan MOOC Pembentukan Jabatan Fungsional Pengantar Kerja Cluster 1: Penempatan Tenaga Kerja dan Perluasan Kesempatan Kerja", "", 60),
  K("", P, "Pelatihan MOOC Pembentukan Jabatan Fungsional Pengantar Kerja Cluster 2: Pengendalian Penggunaan Tenaga Kerja Asing", "", 5),
  K("2025-06-30", P, "Pelatihan Dasar Calon Pegawai Negeri Sipil Angkatan LXVIII Tahun 2025", "", 647, "2025-10-02"),
  K("", P, "Kelas Pembelajaran Mandiri melalui LMS SIBANGKOM: Berakhlak - Kolaboratif", "", 3),
  K("", N, "Indonesian Forum on Labour and Productivity (IFLP): Gig Workers: Flexibility and Vulnerability from Multiple Perspectives", "Peserta", 0),
  K("", N, "Jumpa#3 “Kantor Regional VII BKN Menyapa”: “Layanan Status dan Pemberhentian”", "Peserta", 2),
  K("2026-02-10", N, "Webinar Smart Ergonomics, Smart Safety: “K3 di Era Kerja Digital”", "Peserta", 2),
  K("2026-03-06", N, "Webinar Kemnaker Corpu Learning Series 2: “ASN Mau Kaya dengan Halal? Yuk, Investasi!”", "Peserta", 2),
  K("2025-12-30", P, "Pelatihan Optimalisasi Canva dalam Pembuatan Materi Ajar dan Pembelajaran", "Peserta", 10),
  K("2026-02-09", N, "Webinar Kemnaker Corpu Learning Series 1: “Strategi Mengatasi Fatigue (Kelelahan) dan Burnout untuk Produktivitas Kerja yang Aman dan Efektif”", "Peserta", 2),
  K("2026-02-25", N, "Sharing Session 1 Kemnaker Corpu Learning Series: “Akselerasi SDM Unggul: Lesson Learned dari Worldskills ASEAN Philippines”", "Peserta", 1),
  K("2026-04-06", P, "Training of Trainers (ToT) Pengampu Materi", "", 41, "2026-04-10"),
  K("2026-03-13", N, "Webinar Sharing Session Kemnaker Corpu Learning Series 2: “Penguatan Budaya Keselamatan Kerja: Best Practice dan Lesson Learned dari Knowledge Co-Creation Program JICA Jepang”", "Peserta", 2),
  K("2026-04-16", N, "Webinar Kemnaker Corpu Learning Series 3: “Smart Branding For Smart ASN: Mengukir Reputasi, Menebar Kontribusi”", "Peserta", 2),
  K("2026-05-07", N, "Webinar Kemnaker Corpu Learning Series 4: “Hack Your Innovation: Seni Membedah Masalah Dengan Design Thinking”", "Peserta", 2),
  K("2026-01-20", N, "Webinar K3 Work Rest Balance: “Strategi mengelola waktu kerja demi kesehatan mental”", "Peserta", 2),
  K("2026-01-20", N, "Sharing Session: Work at Hyper Speed", "Peserta", 2),
  K("2026-04-24", N, "Webinar Sharing Session Kemnaker Corpu Learning Series 3: “Dapur Kompetensi Masa Depan: Pengembangan Vocational Training Center Pariwisata”", "Peserta", 1),
  K("2026-05-12", P, "MOOC Pelatihan Public Speaking (Self Learning)", "Peserta", 15, "2026-05-22"),
  K("2026-01-15", N, "Webinar ASN Belajar Seri 1 Start with Smart - From Learning to Impact: “Menata Arah, Menguatkan Langkah Mengemban Amanah”", "Peserta", 3),
  K("2026-02-12", N, "Webinar ASN Belajar Seri 5 Tahun 2026 “From Skill to Recognition: Sertifikasi Profesi ASN - Kompetensi Diakui, Kinerja Terbukti”", "Peserta", 3)
];

/* ================= AKHIR BAGIAN EDIT ================= */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aman = u => /^https?:\/\//i.test(u) ? u : "#";
const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const fmt = t => { if(!t) return "Tanggal belum diisi"; const [y,m,d] = t.split("-").map(Number); return `${d} ${bulan[m-1]} ${y}`; };
const tahunDari = k => k.tanggal ? k.tanggal.slice(0,4) : "Tanggal belum diisi";

document.title = `Portofolio ${PROFIL.nama}`;
$("nama").textContent = PROFIL.nama;
$("jabatan").textContent = `${PROFIL.jabatan}, ${PROFIL.instansi}`;
$("ringkas").textContent = PROFIL.ringkas;
$("update").textContent = PROFIL.diperbarui;
$("tautan").innerHTML = PROFIL.tautan.map(t => `<li><a href="${esc(aman(t.url))}" target="_blank" rel="noopener">${esc(t.label)}</a></li>`).join("");

const semua = [...KEGIATAN].sort((a,b) => b.tanggal.localeCompare(a.tanggal));
const tahunList = [...new Set(semua.map(tahunDari))];

$("fTahun").innerHTML = `<option value="">Semua tahun</option>` + tahunList.map(t => `<option>${t}</option>`).join("");
$("fUnsur").innerHTML = `<option value="">Semua unsur</option>` + UNSUR.map(u => `<option>${esc(u)}</option>`).join("");

function ringkasan(daftar){
  const jp = daftar.reduce((n,k) => n + (Number(k.jp)||0), 0);
  const mengajar = daftar.filter(k => k.unsur === "Pelaksanaan Pembelajaran").length;
  $("ringkasan").innerHTML =
    `<div><b>${daftar.length}</b><span>kegiatan</span></div>` +
    `<div><b>${jp}</b><span>total JP</span></div>` +
    `<div><b>${mengajar}</b><span>sesi pembelajaran</span></div>`;
}

function render(){
  const q = $("cari").value.trim().toLowerCase();
  const ft = $("fTahun").value, fu = $("fUnsur").value;
  const hasil = semua.filter(k =>
    (!ft || tahunDari(k) === ft) && (!fu || k.unsur === fu) &&
    (!q || [k.judul,k.deskripsi,k.peran,k.unsur].join(" ").toLowerCase().includes(q)));
  ringkasan(hasil);
  if(!hasil.length){ $("daftar").innerHTML = `<p class="kosong">Belum ada kegiatan yang cocok. Ubah kata kunci atau filter.</p>`; return; }
  let html = "";
  [...new Set(hasil.map(tahunDari))].forEach(th => {
    const dlm = hasil.filter(k => tahunDari(k) === th);
    const jp = dlm.reduce((n,k) => n + (Number(k.jp)||0), 0);
    html += `<div class="tahun"><h2>${th}</h2><small>${dlm.length} kegiatan · ${jp} JP</small></div>`;
    dlm.forEach(k => {
      const bukti = [].concat(k.bukti || []).map(b => `<a href="${esc(aman(b.url))}" target="_blank" rel="noopener">${esc(b.label)}</a>`).join("");
      html += `<article class="item"><div class="tgl">${fmt(k.tanggal)}${k.sampai ? " – " + fmt(k.sampai) : ""}</div><div>
        <h3>${esc(k.judul)}</h3>
        <div class="meta"><span class="tag">${esc(k.unsur)}</span>${k.peran ? `<span class="tag jp">${esc(k.peran)}</span>` : ""}${k.jp ? `<span class="tag jp">${esc(k.jp)} JP</span>` : ""}</div>
        ${k.deskripsi ? `<p>${esc(k.deskripsi)}</p>` : ""}
        ${bukti ? `<div class="bukti">${bukti}</div>` : ""}
      </div></article>`;
    });
  });
  $("daftar").innerHTML = html;
}
["input","change"].forEach(e => ["cari","fTahun","fUnsur"].forEach(id => $(id).addEventListener(e, render)));
render();
</script>
</body>
</html>
